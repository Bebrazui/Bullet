; PlatformIO Configuration for Bullet OS
; Universal Firmware supporting Multiple ESP32 Variants (S3, WROOM, C3, S2)

[platformio]
default_envs = esp32s3_n16r8

; 1. ESP32-S3 with 16MB Flash and 8MB Octal PSRAM (N16R8)
[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; 2. Standard ESP32 Dual Core (ESP32-WROOM-32 / CYD / 4MB Flash / No PSRAM)
[env:esp32_wroom]
platform = espressif32
board = esp32dev
framework = arduino
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags = 
    -D ESP32_WROOM_BOARD

; 3. ESP32-C3 Single Core RISC-V (4MB Flash / No PSRAM)
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags = 
    -D ESP32_C3_BOARD
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; 4. ESP32 QEMU Emulator Environment
[env:qemu_esp32]
platform = espressif32
board = esp32dev
framework = arduino
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_upload.flash_size = 4MB
monitor_speed = 115200
build_flags = 
    -D QEMU_EMULATION

